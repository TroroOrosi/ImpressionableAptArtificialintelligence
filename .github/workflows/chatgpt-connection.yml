name: ChatGPT connection
on:
  pull_request:
  push:
    branches: [main, 'feat/chatgpt-headless-connection']
permissions:
  contents: read
jobs:
  api-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/market_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: pnpm run typecheck:libs && pnpm --filter @workspace/api-server typecheck
      - run: pnpm --filter @workspace/db push
      - run: pnpm --filter @workspace/api-server test
      - run: docker build --platform linux/amd64 -t market-intel-test .
      - name: Test the actual API-only container over HTTP
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name market-intel -p 8080:8080 -e PUBLIC_BASE_URL=http://127.0.0.1:8080 market-intel-test
          trap 'docker logs market-intel; docker rm -f market-intel' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/healthz >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-chatgpt.mjs http://127.0.0.1:8080 | tee connection-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connection-smoke
          path: connection-smoke.json
          if-no-files-found: ignore
